name: PXOS CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install ply jsonschema pytest pytest-asyncio hypothesis pillow
    - name: Run core tests
      run: |
        pytest tests/test_engine.py -v --cov=core --cov-report=xml
    - name: Run fuzz tests
      run: |
        pytest tests/test_lineage_fuzz.py -v
    - name: Run regression tests
      run: |
        pytest tests/test_regression.py -v
    - name: Archive Hall of Drift
      if: failure()
      uses: actions/upload-artifact@v3
      with:
        name: hall-of-drift
        path: hall_of_drift/
    - name: Upload coverage
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
