name: PXOS DMA CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy hypothesis
      - name: Check for IOMMU
        run: |
          if grep -E 'intel_iommu=on|amd_iommu=on' /proc/cmdline >/dev/null; then
            echo "[ok] IOMMU enabled"
          else
            echo "::warning:: IOMMU not enabled; DMA isolation reduced"
          fi
      - name: Run unit tests
        run: PYTHONPATH=. python -m unittest pxos/test/dma_test.py
      - name: Run property-based tests
        run: PYTHONPATH=. python -m unittest pxos/test/dma_property_test.py
      - name: Run benchmarks
        run: PYTHONPATH=. python pxos/test/dma_benchmark.py
