<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analog Timeline Editor v0.3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Courier New', monospace; background: #1a1a1a; color: #0f0; overflow: hidden; }
    .editor-container { display: grid; grid-template-areas:
      "toolbar toolbar toolbar"
      "timeline timeline preview"
      "properties properties preview";
      grid-template-rows: 50px 1fr 220px; grid-template-columns: 1fr 1fr 420px; height: 100vh; gap: 2px; background: #333; padding: 2px; }
    .toolbar { grid-area: toolbar; background: #2a2a2a; display: flex; align-items: center; padding: 0 12px; gap: 10px; border: 1px solid #0f0; }
    .timeline-area { grid-area: timeline; background: #222; border: 1px solid #0f0; overflow: hidden; display: flex; flex-direction: column; }
    .timeline-ruler { height: 30px; background: #333; border-bottom: 1px solid #0f0; position: relative; overflow: hidden; }
    .timeline-tracks { flex: 1; overflow: auto; }
    .track { height: 60px; border-bottom: 1px solid #333; position: relative; background: #1a1a1a; }
    .track-header { position: absolute; left: 0; top: 0; width: 150px; height: 100%; background: #2a2a2a; border-right: 1px solid #0f0; display: flex; align-items: center; padding: 0 10px; z-index: 10; }
    .track-content { position: absolute; left: 150px; top: 0; right: 0; height: 100%; overflow: hidden; }
    .keyframe { position: absolute; width: 12px; height: 40px; background: #0f0; border-radius: 2px; top: 10px; cursor: pointer; transition: all 0.05s ease; }
    .keyframe:hover { background: #0ff; transform: scale(1.08); }
    .keyframe.selected { background: #ff0; box-shadow: 0 0 10px #ff0; }
    .playhead { position: absolute; width: 2px; height: 100%; background: #f00; top: 0; left: 150px; z-index: 20; pointer-events: none; }
    .time-marker { position: absolute; top: 0; height: 30px; border-left: 1px solid #555; color: #888; font-size: 10px; padding-left: 2px; }
    .properties-area { grid-area: properties; background: #222; border: 1px solid #0f0; padding: 12px; overflow: auto; }
    .preview-area { grid-area: preview; background: #000; border: 1px solid #0f0; display: flex; flex-direction: column; }
    .preview-canvas { border: 1px solid #0f0; image-rendering: pixelated; background: #001100; margin: 10px; }
    .control-panel { padding: 10px; background: #222; border-top: 1px solid #0f0; }
    .btn { background: #003300; border: 1px solid #0f0; color: #0f0; padding: 6px 12px; cursor: pointer; font-family: inherit; }
    .btn:hover { background: #0f0; color: #000; }
    .property-group { margin-bottom: 16px; border: 1px solid #333; padding: 10px; }
    .property-group h3 { color: #ff0; margin-bottom: 8px; }
    .property-row { display: flex; align-items: center; margin-bottom: 8px; gap: 8px; }
    .property-label { width: 80px; color: #0f0; }
    .property-input { background: #333; border: 1px solid #0f0; color: #0f0; padding: 4px 6px; width: 110px; }
    .color-input { width: 40px; height: 30px; border: 1px solid #0f0; background: transparent; }
    .timeline-controls { display: flex; align-items: center; gap: 10px; margin-left: 8px; }
    .time-display { color: #0ff; font-weight: bold; }
    .export-area { margin-top: 10px; padding-top: 10px; border-top: 1px solid #333; }
    .signal-count { color: #0ff; font-size: 12px; margin-top: 5px; }
    .preview-info { padding: 10px; font-size: 12px; color: #888; border-bottom: 1px solid #333; }
    #saveStatus { margin-left: auto; color: #888; font-size: 12px; }
  </style>
</head>
<body>
  <div class="editor-container">
    <!-- Toolbar -->
    <div class="toolbar">
      <h2>🎬 Analog Timeline Editor</h2>
      <button class="btn" onclick="addKeyframe()">+ Add Keyframe</button>
      <button class="btn" onclick="deleteKeyframe()">Delete</button>
      <button class="btn" onclick="duplicateKeyframe()">Duplicate</button>
      <div class="timeline-controls">
        <button class="btn" onclick="play()">▶️ Play</button>
        <button class="btn" onclick="stop()">⏹️ Stop</button>
        <div class="time-display" id="timeDisplay">00:00.0</div>
      </div>
      <button class="btn" onclick="saveProject()">💾 Save</button>
      <button class="btn" onclick="loadProject()">📥 Load</button>
      <input type="file" id="importFile" style="display:none" accept="application/json" />
      <button class="btn" onclick="document.getElementById('importFile').click()">📥 Import JSON</button>
      <span id="saveStatus"></span>
    </div>

    <!-- Timeline -->
    <div class="timeline-area">
      <div class="timeline-ruler" id="timelineRuler">
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="timeline-tracks">
        <div class="track">
          <div class="track-header">Text Track</div>
          <div class="track-content" id="textTrack"></div>
        </div>
        <div class="track">
          <div class="track-header">Position Track</div>
          <div class="track-content" id="positionTrack"></div>
        </div>
        <div class="track">
          <div class="track-header">Color Track</div>
          <div class="track-content" id="colorTrack"></div>
        </div>
      </div>
    </div>

    <!-- Properties Panel -->
    <div class="properties-area">
      <h3>Keyframe Properties</h3>
      <div class="property-group">
        <h3>Content</h3>
        <div class="property-row">
          <label class="property-label">Text:</label>
          <input type="text" class="property-input" id="textInput" value="HELLO" onchange="updateProperty('text', this.value)" />
        </div>
        <div class="property-row">
          <label class="property-label">Time:</label>
          <input type="number" class="property-input" id="timeInput" value="0" step="0.1" onchange="updateKeyframeTime(parseFloat(this.value))" />
          <span>seconds</span>
        </div>
      </div>
      <div class="property-group">
        <h3>Position</h3>
        <div class="property-row">
          <label class="property-label">X:</label>
          <input type="number" class="property-input" id="posXInput" value="20" onchange="updatePosition()" />
        </div>
        <div class="property-row">
          <label class="property-label">Y:</label>
          <input type="number" class="property-input" id="posYInput" value="30" onchange="updatePosition()" />
        </div>
      </div>
      <div class="property-group">
        <h3>Appearance</h3>
        <div class="property-row">
          <label class="property-label">Scale:</label>
          <input type="number" class="property-input" id="scaleInput" value="2" step="0.1" onchange="updateProperty('scale', parseFloat(this.value))" />
        </div>
        <div class="property-row">
          <label class="property-label">Rotation:</label>
          <input type="number" class="property-input" id="rotationInput" value="0" onchange="updateProperty('rotation', parseFloat(this.value))" />
          <span>degrees</span>
        </div>
        <div class="property-row">
          <label class="property-label">Opacity:</label>
          <input type="number" class="property-input" id="opacityInput" value="1" step="0.1" min="0" max="1" onchange="updateProperty('opacity', parseFloat(this.value))" />
        </div>
      </div>
      <div class="property-group">
        <h3>Display</h3>
        <div class="property-row">
            <label class="property-label">Mode:</label>
            <select class="property-input" id="displayModeSelect" onchange="updateDisplayMode()">
                <option value="text">Text</option>
                <option value="fontGrid">Font Grid</option>
            </select>
        </div>
      </div>
      <div class="property-group">
        <h3>Color</h3>
        <div class="property-row">
          <label class="property-label">R:</label>
          <input type="number" class="property-input" id="colorRInput" value="0" min="0" max="255" onchange="updateColor()" />
        </div>
        <div class="property-row">
          <label class="property-label">G:</label>
          <input type="number" class="property-input" id="colorGInput" value="255" min="0" max="255" onchange="updateColor()" />
        </div>
        <div class="property-row">
          <label class="property-label">B:</label>
          <input type="number" class="property-input" id="colorBInput" value="0" min="0" max="255" onchange="updateColor()" />
        </div>
        <div class="property-row">
          <input type="color" class="color-input" id="colorPicker" onchange="updateColorFromPicker()" />
        </div>
      </div>
      <div class="export-area">
        <button class="btn" onclick="exportTimeline()">📤 Export JSON</button>
        <button class="btn" onclick="exportAnalogSignals()">⚡ Export Signals</button>
        <div class="signal-count" id="signalCount">Signals: 0</div>
      </div>
    </div>

    <!-- Preview Area -->
    <div class="preview-area">
      <div class="preview-info">Real-time Analog Preview (160×90)</div>
      <canvas id="previewCanvas" class="preview-canvas" width="160" height="90"></canvas>
      <canvas id="journalLane" class="preview-canvas" width="160" height="10"></canvas>
      <div class="control-panel">
        <div class="property-row">
          <label class="property-label">Easing:</label>
          <select class="property-input" id="easingSelect" onchange="updateEasing()">
            <option value="linear">Linear</option>
            <option value="ease_in_out" selected>Ease In-Out</option>
            <option value="bounce">Bounce</option>
            <option value="elastic">Elastic</option>
          </select>
        </div>
        <div class="property-row">
          <label class="property-label">Duration:</label>
          <input type="number" class="property-input" id="durationInput" value="10.0" step="0.1" min="0.1" onchange="updateDuration()" />
          <span>seconds</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // ===== Helpers / constants =====
    const SNAP = 0.1;                 // seconds
    const RULER_START_PX = 150;       // left edge after headers
    function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
    function snapTime(t){ return Math.round(t / SNAP) * SNAP; }

    // ===== Editor =====
    class AnalogTimelineEditor {
      constructor(){
        this.keyframes = new Map();
        this.currentTime = 0;
        this.totalDuration = 10;
        this.selectedKeyframe = null;
        this.playing = false;
        this.pixelsPerSecond = 50;
        this.timelineOffset = 0; // seconds (pan)
        this.minPPS = 20; this.maxPPS = 300;

        this.canvas = document.getElementById('previewCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.ctx.imageSmoothingEnabled = false;
        this.lane = document.getElementById('journalLane').getContext('2d');
        this.laneFlash = 0;

        // default keyframes
        this.initializeDefaultKeyframes();

        // wheel: zoom/pan
        const tracksEl = document.querySelector('.timeline-tracks');
        tracksEl.addEventListener('wheel', (e)=>{
          if(e.shiftKey){
            const dt = (e.deltaY>0 ? 0.25 : -0.25) * (this.pixelsPerSecond/50);
            this.timelineOffset = clamp(this.timelineOffset + dt, -this.totalDuration, this.totalDuration);
            this.renderTimelineRuler(); this.renderKeyframes(); this.updatePlayhead();
          } else {
            const rect = tracksEl.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const beforeTime = this.pxToTime(mouseX);
            const factor = (e.deltaY>0) ? 0.9 : 1.1;
            this.pixelsPerSecond = clamp(this.pixelsPerSecond * factor, this.minPPS, this.maxPPS);
            const afterTime = this.pxToTime(mouseX);
            this.timelineOffset += (beforeTime - afterTime);
            this.renderTimelineRuler(); this.renderKeyframes(); this.updatePlayhead();
          }
          e.preventDefault();
        }, { passive:false });

        // import JSON
        document.getElementById('importFile').addEventListener('change', (e)=>{
          const f = e.target.files[0]; if(!f) return;
          const r = new FileReader();
          r.onload = ()=>{
            const obj = JSON.parse(r.result);
            if(Array.isArray(obj.keyframes)){
              this.keyframes = new Map(obj.keyframes.map(k => [k.time, k.properties]));
            } else if (Array.isArray(obj)) { // fallback to raw entries
              this.keyframes = new Map(obj);
            }
            this.totalDuration = obj.duration || this.totalDuration;
            this.setupTimeline(); this.updatePlayhead(); this.updatePreview();
          };
          r.readAsText(f);
        });

        this.setupTimeline();
        this.updatePreview();
      }

      // coordinate transforms
      pxToTime(px){ return clamp(((px - RULER_START_PX) / this.pixelsPerSecond) + this.timelineOffset, 0, this.totalDuration); }
      timeToPx(t){ return RULER_START_PX + (t - this.timelineOffset) * this.pixelsPerSecond; }
      fmtTime(t){ const mm = Math.floor(t/60).toString().padStart(2,'0'); const ss = (t%60).toFixed(1).padStart(4,'0'); return `${mm}:${ss}`; }

      initializeDefaultKeyframes() {
          // First four keyframes for boot sequence
          this.keyframes.set(0, {
              text: "BOOTING",
              position: [20, 30],
              color: [0, 255, 0],
              scale: 2,
              opacity: 1.0,
              rotation: 0
          });

          this.keyframes.set(1, {
              text: "INIT SYSTEM",
              position: [40, 30],
              color: [0, 200, 255],
              scale: 2,
              opacity: 1.0,
              rotation: 0
          });

          this.keyframes.set(2, {
              text: "LOAD DRIVERS",
              position: [60, 30],
              color: [255, 165, 0],
              scale: 2,
              opacity: 1.0,
              rotation: 0
          });

          this.keyframes.set(3, {
              text: "READY",
              position: [80, 30],
              color: [0, 255, 0],
              scale: 2,
              opacity: 1.0,
              rotation: 0
          });

          // 5th keyframe - Font system initialization
          this.keyframes.set(5, {
              text: "FONT SYSTEM",
              position: [10, 10],
              color: [255, 255, 255],
              scale: 1,
              opacity: 1.0,
              rotation: 0,
              displayMode: "fontGrid"  // Special mode to show all fonts
          });

          this.selectedKeyframe = 0;
      }

      setupTimeline(){
        this.renderTimelineRuler();
        this.renderKeyframes();
        this.updatePropertyPanel();
      }

      renderTimelineRuler(){
        const ruler = document.getElementById('timelineRuler');
        ruler.innerHTML = '<div class="playhead" id="playhead"></div>';
        for(let i=0; i<=this.totalDuration; i++){
          const marker = document.createElement('div');
          marker.className = 'time-marker';
          marker.style.left = `${this.timeToPx(i)}px`;
          marker.textContent = i + 's';
          ruler.appendChild(marker);
        }
        // drag playhead on ruler
        ruler.onmousedown = (e)=>{
          const move = (ev)=>{ this.currentTime = this.pxToTime(ev.clientX); this.updatePlayhead(); this.updatePreview(); };
          const up = ()=>{ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
          document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
          move(e);
        };
      }

      renderKeyframes(){
        document.getElementById('textTrack').innerHTML = '';
        document.getElementById('positionTrack').innerHTML = '';
        document.getElementById('colorTrack').innerHTML = '';
        this.keyframes.forEach((kf, time)=>{
          this.addKeyframeToTrack('textTrack', time);
          this.addKeyframeToTrack('positionTrack', time);
          this.addKeyframeToTrack('colorTrack', time);
        });
      }

      addKeyframeToTrack(trackId, time){
        const track = document.getElementById(trackId);
        const el = document.createElement('div');
        el.className = 'keyframe';
        // track-content x=0 starts at RULER_START_PX
        el.style.left = `${this.timeToPx(time) - RULER_START_PX}px`;
        el.dataset.time = time;
        if(time === this.selectedKeyframe) el.classList.add('selected');

        // click to select
        el.onclick = (ev)=>{ ev.stopPropagation(); this.selectKeyframe(time); };

        // drag to move (snap)
        el.onmousedown = (downEv)=>{
          downEv.preventDefault();
          const rect = track.getBoundingClientRect();
          const startX = downEv.clientX;
          let t0 = time;
          const move = (mv)=>{
            const dx = mv.clientX - startX;
            const dt = dx / this.pixelsPerSecond;
            let newTime = snapTime(t0 + dt);
            newTime = clamp(newTime, 0, this.totalDuration);
            if(newTime !== time){
              const kf = this.keyframes.get(time);
              // avoid collisions on rekey
              while(this.keyframes.has(newTime) && newTime !== time){ newTime = snapTime(newTime + SNAP); }
              this.keyframes.delete(time);
              this.keyframes.set(newTime, kf);
              time = newTime; this.selectedKeyframe = newTime; this.currentTime = newTime;
              this.renderKeyframes(); this.updatePropertyPanel(); this.updatePlayhead(); this.updatePreview();
            }
          };
          const up = ()=>{ document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); };
          document.addEventListener('mousemove', move); document.addEventListener('mouseup', up);
        };

        track.appendChild(el);
      }

      selectKeyframe(time){
        this.selectedKeyframe = time;
        this.currentTime = time;
        this.renderKeyframes();
        this.updatePropertyPanel();
        this.updatePlayhead();
        this.updatePreview();
      }

      updatePropertyPanel(){
        if(this.selectedKeyframe===null || !this.keyframes.has(this.selectedKeyframe)) return;
        const kf = this.keyframes.get(this.selectedKeyframe);
        document.getElementById('textInput').value = kf.text;
        document.getElementById('timeInput').value = this.selectedKeyframe;
        document.getElementById('posXInput').value = kf.position[0];
        document.getElementById('posYInput').value = kf.position[1];
        document.getElementById('scaleInput').value = kf.scale;
        document.getElementById('rotationInput').value = kf.rotation;
        document.getElementById('opacityInput').value = kf.opacity;
        document.getElementById('colorRInput').value = kf.color[0];
        document.getElementById('colorGInput').value = kf.color[1];
        document.getElementById('colorBInput').value = kf.color[2];
        const hex = '#' + kf.color.map(c => c.toString(16).padStart(2, '0')).join('');
        document.getElementById('colorPicker').value = hex;

        // Add this with the other property updates
        if (kf.displayMode) {
            document.getElementById('displayModeSelect').value = kf.displayMode;
        } else {
            document.getElementById('displayModeSelect').value = 'text';
        }
      }

      updatePlayhead(){
        document.getElementById('playhead').style.left = `${this.timeToPx(this.currentTime)}px`;
        document.getElementById('timeDisplay').textContent = this.fmtTime(this.currentTime);
      }

      // easing + lerp
      applyEasing(t){
        const easing = document.getElementById('easingSelect').value;
        switch(easing){
          case 'linear': return t;
          case 'ease_in_out': return t*t*(3-2*t);
          case 'bounce':
            if(t < 1/2.75) return 7.5625*t*t;
            else if(t < 2/2.75){ t-=1.5/2.75; return 7.5625*t*t+0.75; }
            else if(t < 2.5/2.75){ t-=2.25/2.75; return 7.5625*t*t+0.9375; }
            else { t-=2.625/2.75; return 7.5625*t*t+0.984375; }
          case 'elastic':
            if(t===0||t===1) return t; return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI)/3)+1;
          default: return t;
        }
      }

      getCurrentState(){
        const times = Array.from(this.keyframes.keys()).sort((a,b)=>a-b);
        let fromTime = times[0], toTime = times[times.length-1];
        for(let i=0;i<times.length-1;i++){
          if(this.currentTime >= times[i] && this.currentTime <= times[i+1]){ fromTime = times[i]; toTime = times[i+1]; break; }
        }
        if(this.currentTime <= fromTime) return this.keyframes.get(fromTime);
        if(this.currentTime >= toTime) return this.keyframes.get(toTime);
        const p = this.applyEasing((this.currentTime - fromTime)/(toTime - fromTime));
        const A = this.keyframes.get(fromTime), B = this.keyframes.get(toTime);
        return {
          text: (p<0.5?A.text:B.text),
          position: [ A.position[0] + (B.position[0]-A.position[0])*p,
                      A.position[1] + (B.position[1]-A.position[1])*p ],
          color: [ Math.round(A.color[0] + (B.color[0]-A.color[0])*p),
                   Math.round(A.color[1] + (B.color[1]-A.color[1])*p),
                   Math.round(A.color[2] + (B.color[2]-A.color[2])*p) ],
          scale: A.scale + (B.scale-A.scale)*p,
          opacity: A.opacity + (B.opacity-A.opacity)*p,
          rotation: A.rotation + (B.rotation-A.rotation)*p
        };
      }

      // crisp bitmap font (5x7)
      bitmap5x7 = {
        ' ': [0,0,0,0,0],
        'A':[0x0E,0x11,0x1F,0x11,0x11],
        'B':[0x1E,0x11,0x1E,0x11,0x1E],
        'C':[0x0E,0x11,0x10,0x11,0x0E],
        'D':[0x1E,0x11,0x11,0x11,0x1E],
        'E':[0x1F,0x10,0x1E,0x10,0x1F],
        'F':[0x1F,0x10,0x1E,0x10,0x10],
        'G':[0x0E,0x11,0x13,0x11,0x0E],
        'H':[0x11,0x11,0x1F,0x11,0x11],
        'I':[0x0E,0x04,0x04,0x04,0x0E],
        'J':[0x1B,0x02,0x02,0x12,0x0C],
        'K':[0x11,0x12,0x14,0x18,0x11],
        'L':[0x10,0x10,0x10,0x10,0x1F],
        'M':[0x11,0x1B,0x15,0x11,0x11],
        'N':[0x11,0x19,0x15,0x13,0x11],
        'O':[0x0E,0x11,0x11,0x11,0x0E],
        'P':[0x1E,0x11,0x1E,0x10,0x10],
        'Q':[0x0E,0x11,0x15,0x13,0x0D],
        'R':[0x1E,0x11,0x1E,0x14,0x13],
        'S':[0x09,0x15,0x15,0x15,0x06],
        'T':[0x1F,0x04,0x04,0x04,0x04],
        'U':[0x11,0x11,0x11,0x11,0x0E],
        'V':[0x11,0x11,0x11,0x0A,0x04],
        'W':[0x11,0x11,0x15,0x15,0x1B],
        'X':[0x11,0x0A,0x04,0x0A,0x11],
        'Y':[0x11,0x0A,0x04,0x04,0x04],
        'Z':[0x17,0x15,0x11,0x11,0x11],
        '0':[0x0E,0x11,0x13,0x11,0x0E],
        '1':[0x04,0x0C,0x04,0x04,0x0E],
        '2':[0x0E,0x11,0x02,0x04,0x1F],
        '3':[0x1F,0x02,0x0E,0x02,0x1F],
        '4':[0x10,0x10,0x1E,0x01,0x01],
        '5':[0x1F,0x10,0x1E,0x01,0x1E],
        '6':[0x0E,0x10,0x1E,0x11,0x0E],
        '7':[0x1F,0x01,0x02,0x04,0x08],
        '8':[0x0E,0x11,0x0E,0x11,0x0E],
        '9':[0x0E,0x11,0x0F,0x01,0x0E],
        '!':[0x04,0x04,0x04,0x00,0x04],
        '?':[0x0E,0x11,0x02,0x00,0x04],
        '.':[0x00,0x00,0x00,0x00,0x04],
        ',':[0x00,0x00,0x00,0x04,0x04],
        ':':[0x00,0x04,0x00,0x04,0x00],
        ';':[0x00,0x04,0x00,0x04,0x04],
        '+':[0x00,0x04,0x1F,0x04,0x00],
        '-':[0x00,0x00,0x1F,0x00,0x00],
        '/':[0x01,0x02,0x04,0x08,0x10],
        '=':[0x00,0x1F,0x00,0x1F,0x00],
        '[':[0x0E,0x08,0x08,0x08,0x0E],
        ']':[0x0E,0x02,0x02,0x02,0x0E],
        '*':[0x00,0x15,0x0E,0x15,0x00],
        '<':[0x03,0x0C,0x30,0x0C,0x03],
        '>':[0x18,0x06,0x03,0x06,0x18],
        '@':[0x0E,0x11,0x15,0x0D,0x0E],
        '#':[0x0A,0x1F,0x0A,0x1F,0x0A],
        '$':[0x06,0x19,0x16,0x19,0x06],
        '%':[0x11,0x12,0x04,0x08,0x11],
        '^':[0x04,0x0A,0x11,0x00,0x00],
        '&':[0x06,0x09,0x06,0x11,0x16],
        '_':[0x00,0x00,0x00,0x00,0x1F],
        '`':[0x04,0x02,0x00,0x00,0x00],
        '|':[0x04,0x04,0x04,0x04,0x04],
        '~':[0x08,0x15,0x02,0x00,0x00],
        '"':[0x0A,0x0A,0x00,0x00,0x00],
        '\'':[0x04,0x04,0x00,0x00,0x00],
        '(':[0x02,0x04,0x04,0x04,0x02],
        ')':[0x08,0x04,0x04,0x04,0x08],
        '{':[0x04,0x08,0x1C,0x08,0x04],
        '}':[0x10,0x08,0x1C,0x08,0x10]
      };
      drawFontGrid(x, y, scale, color) {
        const [r, g, b] = color;
        this.ctx.fillStyle = `rgb(${r},${g},${b})`;

        // Calculate grid layout
        const charsPerRow = 16;
        const charWidth = 6 * scale; // 5px + 1px space
        const charHeight = 8 * scale; // 7px + 1px space
        const startX = Math.round(x);
        const startY = Math.round(y);

        // Draw each character
        let charIndex = 0;
        for (const char in this.bitmap5x7) {
          const row = Math.floor(charIndex / charsPerRow);
          const col = charIndex % charsPerRow;

          const posX = startX + col * charWidth;
          const posY = startY + row * charHeight;

          // Draw the character
          this.drawBitmapText(char, posX, posY, scale, color);

          // Draw character code below
          const code = char.charCodeAt(0).toString(16).padStart(2, '0').toUpperCase();
          this.ctx.font = `${Math.max(6, scale * 3)}px monospace`;
          this.ctx.fillText(code, posX, posY + charHeight + scale * 4);

          charIndex++;
        }
      }

      drawBitmapText(txt, x, y, scale, color){
        const [r,g,b] = color; this.ctx.fillStyle = `rgb(${r},${g},${b})`;
        let cx = Math.round(x), cy = Math.round(y);
        const s = Math.max(1, Math.round(scale));
        for(const ch of txt){
          const glyph = this.bitmap5x7[ch.toUpperCase()] || this.bitmap5x7[' '];
          for(let col=0; col<5; col++){
            const colBits = glyph[col] || 0;
            for(let row=0; row<7; row++){
              if(colBits & (1<<(6-row))){ this.ctx.fillRect(cx + col*s, cy + row*s, s, s); }
            }
          }
          cx += (6*s); // 5px glyph + 1px space
        }
      }

      updatePreview(){
        const state = this.getCurrentState();
        // clear
        this.ctx.fillStyle = '#001100';
        this.ctx.fillRect(0,0,160,90);
        // signals estimate (for UI only)
        const signals = this.generateAnalogSignalsEstimate(state);
        document.getElementById('signalCount').textContent = `Signals: ${signals.length}`;
        // draw text
        this.drawText(state);
        // journal lane
        this.drawJournalLane();
      }

      drawText(state) {
        const { text, position, color, scale, opacity, rotation, displayMode } = state;
        const [r, g, b] = color.map(c => Math.round(c * opacity));

        this.ctx.fillStyle = `rgb(${r},${g},${b})`;

        this.ctx.save();
        this.ctx.translate(Math.round(position[0]), Math.round(position[1]));
        this.ctx.rotate(rotation * Math.PI / 180);

        if (displayMode === 'fontGrid') {
          // Draw the font grid
          this.drawFontGrid(0, 0, scale, [r, g, b]);
        } else {
          // Default text rendering
          this.drawBitmapText(text, 0, 0, Math.max(1, Math.round(scale)), [r, g, b]);
        }

        this.ctx.restore();
      }

      generateAnalogSignalsEstimate(state){
        const { text, scale } = state;
        const estimatedPixels = Math.max(1, Math.floor(text.length * 35 * scale * scale));
        const out = new Array(estimatedPixels);
        for(let i=0;i<estimatedPixels;i++){ out[i] = i; }
        return out;
      }

      // export current frame (scan canvas for non-background pixels)
      exportCurrentFrameSignalsCSV(){
        const w = this.canvas.width, h = this.canvas.height;
        const bg = [0x00,0x11,0x00];
        const id = this.ctx.getImageData(0,0,w,h).data;
        const rows = ["timestamp_ms,x,y,r,g,b"]; const ts = Math.round(this.currentTime*1000);
        for(let y=0;y<h;y++){
          for(let x=0;x<w;x++){
            const i = (y*w + x)*4; const r=id[i], g=id[i+1], b=id[i+2], a=id[i+3];
            if(a===0) continue;
            if(Math.abs(r-bg[0])<2 && Math.abs(g-bg[1])<2 && Math.abs(b-bg[2])<2) continue;
            rows.push(`${ts},${x},${y},${r},${g},${b}`);
          }
        }
        const blob = new Blob([rows.join('\n')], {type:'text/csv'});
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = `signals_frame_${ts}.csv`; a.click();
      }

      play(){ this.playing = true; this.animationLoop(); }
      stop(){ this.playing = false; }
      animationLoop(){
        if(!this.playing) return;
        this.currentTime += 1/60;
        if(this.currentTime > this.totalDuration) this.currentTime = 0;
        this.updatePlayhead(); this.updatePreview();
        requestAnimationFrame(()=>this.animationLoop());
      }

      exportTimeline(){
        const data = {
          keyframes: Array.from(this.keyframes.entries()).map(([time, kf])=>({ time, properties: kf })),
          duration: this.totalDuration,
          easing: document.getElementById('easingSelect').value
        };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob); const a = document.createElement('a');
        a.href = url; a.download = 'timeline.json'; a.click();
      }

      // journal lane visuals
      flashJournal(){ this.laneFlash = 6; }
      drawJournalLane(){
        const w=160,h=10; this.lane.fillStyle = '#001100'; this.lane.fillRect(0,0,w,h);
        const t = performance.now()/120;
        for(let x=0;x<w;x+=8){ this.lane.fillStyle = '#033'; this.lane.fillRect((x + (t%8)),0,1,h); }
        if(this.laneFlash>0){ this.lane.fillStyle = '#0f0'; this.lane.fillRect(0,0,w,h); this.laneFlash--; }
      }
    }

    // ===== Global editor instance =====
    let editor;
    window.onload = ()=>{ editor = new AnalogTimelineEditor(); };

    // ===== UI Event Handlers (globals) =====
    function addKeyframe(){
      const newTime = snapTime(editor.currentTime);
      if(!editor.keyframes.has(newTime)){
        const last = editor.keyframes.get(editor.selectedKeyframe) || { text:"NEW", position:[80,45], color:[255,255,255], scale:2, opacity:1, rotation:0 };
        editor.keyframes.set(newTime, { ...last });
        editor.selectedKeyframe = newTime; editor.setupTimeline(); editor.updatePreview();
      }
    }
    function deleteKeyframe(){
      if(editor.selectedKeyframe!==null && editor.keyframes.size>1){
        editor.keyframes.delete(editor.selectedKeyframe);
        editor.selectedKeyframe = Array.from(editor.keyframes.keys())[0];
        editor.setupTimeline(); editor.updatePreview();
      }
    }
    function duplicateKeyframe(){
      if(editor.selectedKeyframe!==null){
        const kf = { ...editor.keyframes.get(editor.selectedKeyframe) };
        let newTime = snapTime(editor.selectedKeyframe + 1);
        while(editor.keyframes.has(newTime)) newTime = snapTime(newTime + SNAP);
        editor.keyframes.set(newTime, kf); editor.selectedKeyframe = newTime;
        editor.setupTimeline(); editor.updatePreview();
      }
    }
    function updateProperty(property, value){
      if(editor.selectedKeyframe===null) return;
      const t = editor.selectedKeyframe; const kf = { ...editor.keyframes.get(t) };
      kf[property] = value; editor.keyframes.set(t, kf);
      editor.renderKeyframes(); editor.updatePropertyPanel(); editor.updatePreview();
    }
    function updatePosition(){
      const x = parseInt(document.getElementById('posXInput').value);
      const y = parseInt(document.getElementById('posYInput').value);
      updateProperty('position', [x,y]);
    }
    function updateColor(){
      const r = parseInt(document.getElementById('colorRInput').value);
      const g = parseInt(document.getElementById('colorGInput').value);
      const b = parseInt(document.getElementById('colorBInput').value);
      updateProperty('color', [r,g,b]);
      const hex = '#' + [r,g,b].map(c=>c.toString(16).padStart(2,'0')).join('');
      document.getElementById('colorPicker').value = hex;
    }
    function updateColorFromPicker(){
      const hex = document.getElementById('colorPicker').value;
      const r = parseInt(hex.substr(1,2),16), g = parseInt(hex.substr(3,2),16), b = parseInt(hex.substr(5,2),16);
      document.getElementById('colorRInput').value = r;
      document.getElementById('colorGInput').value = g;
      document.getElementById('colorBInput').value = b;
      updateProperty('color', [r,g,b]);
    }
    function updateDisplayMode() {
        const mode = document.getElementById('displayModeSelect').value;
        updateProperty('displayMode', mode);
    }
    function updateKeyframeTime(newTime){
      if(editor.selectedKeyframe===null) return;
      newTime = snapTime(parseFloat(newTime)); if(isNaN(newTime)) return;
      if(newTime === editor.selectedKeyframe) return;
      const kf = editor.keyframes.get(editor.selectedKeyframe);
      editor.keyframes.delete(editor.selectedKeyframe);
      while(editor.keyframes.has(newTime)) newTime = snapTime(newTime + SNAP);
      editor.keyframes.set(newTime, kf); editor.selectedKeyframe = newTime;
      editor.setupTimeline(); editor.updatePreview();
    }
    function updateEasing(){ editor.updatePreview(); }
    function updateDuration(){
      const v = parseFloat(document.getElementById('durationInput').value);
      if(isNaN(v) || v<=0) return;
      editor.totalDuration = v; editor.renderTimelineRuler(); editor.updatePlayhead(); editor.updatePreview();
    }
    function play(){ editor.play(); }
    function stop(){ editor.stop(); }
    function exportTimeline(){ editor.exportTimeline(); editor.flashJournal(); saveProject(); }
    function exportAnalogSignals(){ editor.exportCurrentFrameSignalsCSV(); editor.flashJournal(); }

    // autosave / load
    function projectKey(name){ return `ATE:project:${name||'default'}`; }
    function saveProject(name='default'){
      const data = {
        keyframes: Array.from(editor.keyframes.entries()),
        totalDuration: editor.totalDuration,
        pixelsPerSecond: editor.pixelsPerSecond,
        timelineOffset: editor.timelineOffset
      };
      localStorage.setItem(projectKey(name), JSON.stringify(data));
      document.getElementById('saveStatus').textContent = `Saved ${new Date().toLocaleTimeString()}`;
    }
    function loadProject(name='default'){
      const raw = localStorage.getItem(projectKey(name)); if(!raw) return;
      const obj = JSON.parse(raw);
      editor.keyframes = new Map(obj.keyframes);
      editor.totalDuration = obj.totalDuration || editor.totalDuration;
      editor.pixelsPerSecond = obj.pixelsPerSecond || editor.pixelsPerSecond;
      editor.timelineOffset = obj.timelineOffset || 0;
      editor.setupTimeline(); editor.updatePlayhead(); editor.updatePreview();
    }
    window.addEventListener('beforeunload', ()=>saveProject());
  </script>
</body>
